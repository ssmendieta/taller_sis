services:
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: taller_pubsub_emulator
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --project=${TALLER_PUBSUB_PROJECT_ID:-taller-local}
      - --host-port=0.0.0.0:8085
    ports:
      - "${PUBSUB_EMULATOR_PORT:-8085}:8085"
    profiles: ["emulator"]

  postgres:
    image: postgres:15-alpine
    container_name: taller_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-${POSTGRES_USER:-postgres}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
      POSTGRES_DB: ${DB_AUTH_DATABASE:-${POSTGRES_DB:-auth_db}}
    ports:
      - "${DB_PORT:-${POSTGRES_PORT:-5432}}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_AUTH_DATABASE:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles: ["db", "full"]

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      - PORT=${GATEWAY_PORT:-3000}
      - NODE_ENV=${NODE_ENV:-development}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - PRODUCCION_SERVICE_URL=http://produccion-service:3002
      - LOGISTICA_SERVICE_URL=http://logistica-service:3003
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-3001}:3001"
    environment:
      - PORT=${AUTH_SERVICE_PORT:-3001}
      - NODE_ENV=${NODE_ENV:-development}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_DATABASE=${DB_AUTH_DATABASE:-auth_db}
      - SKIP_DB=${SKIP_DB:-false}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET es obligatorio. Defínelo en .env (ver .env.example)}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - SESION_INACTIVIDAD_MINUTOS=${SESION_INACTIVIDAD_MINUTOS:-15}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NOMBRE=${ADMIN_NOMBRE:-}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  produccion-service:
    build: ./services/produccion-service
    container_name: produccion-service
    ports:
      - "${PRODUCCION_SERVICE_PORT:-3002}:3002"
    environment:
      - PORT=${PRODUCCION_SERVICE_PORT:-3002}
      - NODE_ENV=${NODE_ENV:-development}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_DATABASE=${DB_PRODUCCION_DATABASE:-produccion_db}
      - SKIP_DB=${SKIP_DB:-false}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - PUBSUB_ENABLED=${PUBSUB_ENABLED:-false}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - PUBSUB_TOPIC_ID=${PUBSUB_TOPIC_ID:-}
      - PUBSUB_CONSUMER_ENABLED=${PUBSUB_CONSUMER_ENABLED:-false}
      - PUBSUB_SUBSCRIPTION_ID=${PUBSUB_SUBSCRIPTION_ID:-}
      - PUBSUB_CONTABILIDAD_CONSUMER_ENABLED=${PUBSUB_CONTABILIDAD_CONSUMER_ENABLED:-false}
      - PUBSUB_CONTABILIDAD_RESULTADOS_TOPIC_ID=${PUBSUB_CONTABILIDAD_RESULTADOS_TOPIC_ID:-}
      - PUBSUB_CONTABILIDAD_RESULTADOS_SUBSCRIPTION_ID=${PUBSUB_CONTABILIDAD_RESULTADOS_SUBSCRIPTION_ID:-}
      - PUBSUB_EMULATOR_HOST=${PUBSUB_EMULATOR_HOST:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp/pubsub-service-account.json
      - OUTBOX_BATCH_SIZE=${OUTBOX_BATCH_SIZE:-20}
      - OUTBOX_POLL_INTERVAL_MS=${OUTBOX_POLL_INTERVAL_MS:-5000}
      - OUTBOX_LEASE_MS=${OUTBOX_LEASE_MS:-30000}
      - OUTBOX_RETRY_BASE_MS=${OUTBOX_RETRY_BASE_MS:-5000}
      - OUTBOX_RETRY_MAX_MS=${OUTBOX_RETRY_MAX_MS:-300000}
    volumes:
      - type: bind
        source: ${GCP_CREDENTIALS_HOST_PATH}
        target: /run/secrets/gcp/pubsub-service-account.json
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  logistica-service:
    build: ./services/logistica-service
    container_name: logistica-service
    ports:
      - "${LOGISTICA_SERVICE_PORT:-3003}:3003"
    environment:
      - PORT=${LOGISTICA_SERVICE_PORT:-3003}
      - NODE_ENV=${NODE_ENV:-development}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_DATABASE=${DB_LOGISTICA_DATABASE:-logistica_db}
      - SKIP_DB=${SKIP_DB:-false}
      # Dentro de la red de Compose el host de Auth es el nombre del servicio,
      # no localhost (el contenedor solo escucha en su propio puerto).
      - AUTH_SERVICE_URL=http://auth-service:3001
      - PRODUCCION_SERVICE_URL=http://produccion-service:3002
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:${GATEWAY_PORT:-3000}
    profiles: ["full"]

volumes:
  pgdata:
